version: 2

updates:
  # One PR for every action bump, majors included: for a SHA-pinned action a
  # major is usually a runner bump. Dependabot reads the trailing `# v…`
  # comment on each pinned SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]

  # The base images carry a tag and a digest; Dependabot moves both.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    groups:
      docker:
        patterns: ["*"]

  # Minor and patch bumps in one PR. A Go major is an import-path change, so
  # each arrives on its own.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-deps:
        patterns: ["*"]
        update-types: [minor, patch]
