name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those based on main, so a stacked branch is
  # tested before it reaches the front of the queue.
  pull_request:
  # release.yml reruns CI on the tagged commit before it builds anything.
  workflow_call:

permissions:
  contents: read

# A superseded pull request run has nothing left to report. Runs on main are
# never cancelled, so every commit there gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSP_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/minio
      - run: go vet ./...
      - run: go test -race ./...
      # The lookup's memory bound is checked only without the race detector.
      - run: go test -run '^TestLookupStreams$' ./internal/ecosystem/apt
      - run: make tailnet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSP_TEST_S3_ENDPOINT: http://localhost:9000
      TSP_TEST_MAVEN_SEED: ${{ github.workspace }}/.maven-seed
      # The pinned mvn (see the install step); it fetches the seed, so it
      # is part of the seed's cache key.
      MAVEN_VERSION: 3.10.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Pinned: the PyPI tests judge protocol conformance by these clients.
      # Bump deliberately.
      - run: python -m pip install uv==0.12.21 twine==7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      # Pinned: the npm tests judge protocol conformance by these clients.
      # Bump deliberately. Exact versions, like the pip line above, so no
      # lockfile is needed.
      - run: npm install -g npm@11.20.0 pnpm@12.21.0 # zizmor: ignore[adhoc-packages]
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # Pinned: the Maven tests judge protocol conformance by these clients.
      # Bump deliberately. The published builds, pinned by digest; they go
      # first on PATH, ahead of the runner's own.
      - env:
          MAVEN_SHA256: 8ba13121794243e604dbca50439f6ae649ce602675a167129556fd502947b249
          GRADLE_VERSION: 9.9.2
          GRADLE_SHA256: 971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b
        run: |
          curl -fsSL -o maven.tar.gz \
            "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA256  maven.tar.gz" | sha256sum -c -
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  gradle.zip" | sha256sum -c -
          tar -xzf maven.tar.gz -C "$RUNNER_TEMP"
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          rm maven.tar.gz gradle.zip
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      # The plugins and dependencies the mvn tests' fake upstream serves,
      # fetched from Maven Central once per seed POM.
      - id: maven-seed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .maven-seed
          key: maven-seed-${{ env.MAVEN_VERSION }}-${{ hashFiles('integration/testdata/maven/seed/**/pom.xml') }}
      - if: steps.maven-seed.outputs.cache-hit != 'true'
        run: make maven-seed
      - uses: ./.github/actions/minio
      # The apt tests use the runner's own apt-get and apt-cache.
      - run: apt-get --version
      # Below the job's timeout, so a hang prints its goroutine dump.
      - run: go test -timeout 25m -tags integration ./integration/...

  lint-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: a new release can ship stricter rules. Bump deliberately.
          version: v2.14.0
      # `golangci-lint run` ignores the formatters section; only `fmt` checks it.
      - run: make fmt-check
      - run: make vuln

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The published build, pinned by digest.
      - env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm actionlint actionlint.tar.gz
      - run: actionlint -color
      - run: pipx install zizmor==1.30.1
      # Online, so an action that turns known-bad fails a run.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows/ .github/actions/

  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The published build, pinned by digest.
      - env:
          VERSION: 3.22.0
          SHA256: 52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10
        run: |
          curl -fsSL -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v$VERSION/vale_${VERSION}_Linux_64-bit.tar.gz"
          echo "$SHA256  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          rm vale vale.tar.gz
      - run: make lint-docs VALE_FLAGS=--output=.vale/github.tmpl

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
