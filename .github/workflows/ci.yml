name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TSP_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start MinIO
        # MinIO no longer publishes pullable images; build a pinned commit from source.
        run: |
          go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup "$(go env GOPATH)/bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address :9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 60); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - run: go test -tags integration ./integration/...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build .
