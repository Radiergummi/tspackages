# Prose linting for the docs; `make lint-docs` runs it. The Google and
# proselint styles are fetched and checksummed by the Makefile, and gitignored.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tspackages

[*.md]
BasedOnStyles = Vale, Google, proselint, Tspackages

# The docs list without a serial comma ("git, storage and registry").
Google.OxfordComma = NO

# Google's product and mobile vocabulary, which trips on third-party names.
Google.WordList = NO
Google.WordListCase = NO

# Flags GitHub's `> [!NOTE]` alerts; Tspackages.Placeholders takes its place.
proselint.Annotations = NO

# Suggests typographic ellipses and symbols; Tspackages.Typography wants plain
# ASCII instead.
proselint.Typography = NO

# Errors fail the build and warnings only annotate. Headings are part of what
# keeps the pages uniform, so they fail it too.
Google.Headings = error
