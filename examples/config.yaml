# Example tspackages configuration. Secrets are referenced,
# never inlined: ${env:NAME} or ${file:/path}.
tailscale:
  hostname: registry
  state_dir: /var/lib/tspackages/tailscale   # secret: node and TLS keys; 0700
  capability: github.com/radiergummi/tspackages
  tags: [tag:registry]                       # advertised when TS_AUTHKEY is an OAuth client secret

storage:
  work_dir: /var/lib/tspackages/work         # git mirrors + SSH material; 0700, owned by the service user
  cache: {driver: fs, path: /var/lib/tspackages/cache, max_size: 50GiB}
  state: {driver: s3, bucket: matchory-registry, endpoint: "https://s3.example.com", prefix: state/}
  stores:
    main: {driver: s3, bucket: matchory-registry, endpoint: "https://s3.example.com", prefix: hosted/}

ecosystems:
  composer:
    sources:
      - name: matchory-git
        type: git
        claims: ["matchory/*"]
        remotes:
          - git@github.com:matchory/sdk-php.git
          - git@github.com:matchory/laravel-helpers.git
        ssh_key: ${env:DEPLOY_KEY}
        known_hosts: ${env:KNOWN_HOSTS}      # required for SSH remotes
        # branches: [main]                   # dev-* versions; default: the default branch only
        # poll_interval: 1m
      - name: hosted
        type: storage
        store: main
        claims: ["matchory-internal/*"]
      - name: packagist
        type: registry
        url: https://repo.packagist.org
        fetch_hosts: [repo.packagist.org, api.github.com, codeload.github.com]
        # metadata_ttl: 5m
        # Public-only tokens: upstream metadata decides which URLs get fetched.
        download_credentials:
          api.github.com: {bearer: "${env:GITHUB_TOKEN}"}   # anonymous limit is 60 req/h

  pypi:
    sources:
      # Storage first: its claim overlaps "matchory-*" below, and uploads go
      # to the first claiming source.
      - name: hosted
        type: storage
        store: main
        claims: ["matchory-internal-*"]
      - name: matchory-git
        type: git
        claims: ["matchory", "matchory-*"]   # "matchory-*" alone doesn't cover "matchory"
        remotes:
          - git@github.com:matchory/python-sdk.git
          - git@github.com:matchory/mono.git
        ssh_key: ${env:DEPLOY_KEY}
        known_hosts: ${env:KNOWN_HOSTS}
        # Optional, per remote: which members a tag releases. Without it,
        # every tag releases every package found at that commit.
        tags:
          git@github.com:matchory/mono.git:
            "core@*": [packages/core]
            "v*": ["*"]
      - name: pypi
        type: registry
        url: https://pypi.org/simple/
        fetch_hosts: [pypi.org, files.pythonhosted.org]
